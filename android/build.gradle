buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        maven { url "https://maven.sumsub.com/repository/maven-public/" }
    }
    configurations.all {
        // Force a single OkHttp version. Firebase Auth pulls in 5.x while
        // React Native 0.83 was built against 4.x — the mismatch shows up as
        // `NoClassDefFoundError: okhttp3.internal.Util` at first HTTP call
        // (right after login, since that's when the token'd fetch runs).
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.squareup.okhttp3') {
                details.useVersion '4.12.0'
                details.because 'Pin OkHttp to RN 0.83-compatible 4.x to avoid Util class mismatch'
            }
        }
    }
}
